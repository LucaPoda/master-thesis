<!-- index.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Semantic Graph Visualizer</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background-color: #1e1e1e; color: #fff;}
        #network-container { flex: 1; height: 100%; }
        #sidebar { width: 350px; background: #2d2d30; padding: 20px; box-shadow: -2px 0 5px rgba(0,0,0,0.5); overflow-y: auto; z-index: 10;}
        
        .panel { background: #3e3e42; padding: 15px; border-radius: 8px; margin-bottom: 20px; min-height: 100px; display: none;}
        h3 { margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 5px; }
        
        .object-square {
            display: inline-block;
            width: 35px; height: 35px;
            line-height: 35px; text-align: center;
            color: #fff; font-weight: bold; font-size: 12px;
            margin: 3px; border-radius: 4px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
        }
        .diff-section { margin-top: 10px; }
        .diff-title { font-size: 14px; margin-bottom: 5px; color: #aaa;}
    </style>
</head>
<body>

    <div id="network-container"></div>
    
    <div id="sidebar">
        <h2>Dettagli Grafo</h2>
        <div id="hover-panel" class="panel">
            <h3 id="hover-title">Contenuto Nodo</h3>
            <div id="hover-content">Passa il mouse su un nodo.</div>
        </div>
        
        <div id="diff-panel" class="panel">
            <h3 id="diff-title">Differenza Archi</h3>
            <div class="diff-section">
                <div class="diff-title" id="diff-side-a-title">Solo in A:</div>
                <div id="diff-side-a"></div>
            </div>
            <div class="diff-section">
                <div class="diff-title" id="diff-side-b-title">Solo in B:</div>
                <div id="diff-side-b"></div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('network-container');
        const nodes = new vis.DataSet([]);
        const edges = new vis.DataSet([]);
        
        let globalData = { nodes: [], colors: {} };
        let pinnedNode = null; 

        const options = {
            nodes: { shape: 'dot', size: 15, font: { size: 14, color: '#ffffff' } },
            edges: { width: 2, color: { inherit: false, color: '#888' } },
            interaction: { hover: true },
            physics: { barnesHut: { springLength: 150 } }
        };

        const network = new vis.Network(container, { nodes, edges }, options);

        function generateSquare(objId) {
            const color = globalData.colors[objId] || '#555';
            return `<div class="object-square" style="background-color: ${color};">${objId}</div>`;
        }
        
        function formatRelation(relString, highlightColor = "") {
            const parts = relString.split('_');
            const style = highlightColor ? `border-left: 3px solid ${highlightColor}; padding-left: 5px;` : '';
            return `<div style="margin-top: 4px; font-size: 12px; ${style}">
                ${generateSquare(parts[0])} <b>${parts[1]}</b> ${generateSquare(parts[2])}
            </div>`;
        }

        const ws = new WebSocket(`ws://${location.host}/ws`);
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            globalData = data; 
            
            const visNodes = data.nodes.map(n => ({
                id: n.id,
                label: n.label,
                borderWidth: n.is_current ? 4 : 1,
                color: {
                    border: n.is_current ? '#ff3b30' : '#2B7CE9',
                    background: n.is_current ? '#ffb3b0' : '#97C2FC'
                },
                shadow: n.is_current
            }));

            nodes.update(visNodes); 
            edges.update(data.edges);
        };

        function renderNodeDetails(nodeId, isPinned) {
            const nodeData = globalData.nodes.find(n => n.id === nodeId);
            if (!nodeData) return;
            
            const panel = document.getElementById('hover-panel');
            panel.style.display = 'block';
            panel.style.border = isPinned ? "2px solid #ff3b30" : "none"; 
            
            const title = isPinned ? `${nodeData.label} 📌` : nodeData.label;
            document.getElementById('hover-title').innerText = title;
            
            const objHtml = nodeData.objects.map(generateSquare).join('');
            const objSection = `<div><strong>Objects:</strong><br>${objHtml || '<i>None</i>'}</div>`;
            
            let relHtml = '<i>None</i>';
            if (nodeData.relations && nodeData.relations.length > 0) {
                relHtml = nodeData.relations.map(r => formatRelation(r)).join('');
            }
            const relSection = `<div style="margin-top:10px;"><strong>Relations:</strong><br>${relHtml}</div>`;
            
            document.getElementById('hover-content').innerHTML = objSection + relSection;
        }

        network.on("hoverNode", function (params) {
            if (!pinnedNode) {
                renderNodeDetails(params.node, false);
            }
        });

        network.on("blurNode", function () {
            if (!pinnedNode) {
                document.getElementById('hover-panel').style.display = 'none';
            }
        });

        network.on("click", function (params) {
            const diffPanel = document.getElementById('diff-panel');
            
            if (params.nodes.length > 0) {
                pinnedNode = params.nodes[0];
                renderNodeDetails(pinnedNode, true);
                diffPanel.style.display = 'none';
                
            } else if (params.edges.length === 1 && params.nodes.length === 0) {
                pinnedNode = null; 
                document.getElementById('hover-panel').style.display = 'none';
                document.getElementById('hover-panel').style.border = 'none';
                
                const edgeId = params.edges[0];
                const edge = globalData.edges.find(e => e.id === edgeId);
                
                const nodeA = globalData.nodes.find(n => n.id === edge.from);
                const nodeB = globalData.nodes.find(n => n.id === edge.to);
                
                // Object Diffs
                const setObjA = new Set(nodeA.objects);
                const setObjB = new Set(nodeB.objects);
                const objOnlyInA = nodeA.objects.filter(x => !setObjB.has(x));
                const objOnlyInB = nodeB.objects.filter(x => !setObjA.has(x));

                // Relation Diffs
                const setRelA = new Set(nodeA.relations || []);
                const setRelB = new Set(nodeB.relations || []);
                const relOnlyInA = (nodeA.relations || []).filter(x => !setRelB.has(x));
                const relOnlyInB = (nodeB.relations || []).filter(x => !setRelA.has(x));

                document.getElementById('diff-side-a-title').innerText = `Solo in ${nodeA.label} (Removed from B):`;
                let htmlA = `<div><strong>Objects:</strong></div>` + (objOnlyInA.map(generateSquare).join('') || '-');
                htmlA += `<div style="margin-top:8px;"><strong>Relations:</strong></div>` + (relOnlyInA.map(r => formatRelation(r, '#ff4444')).join('') || '-');
                document.getElementById('diff-side-a').innerHTML = htmlA;
                
                document.getElementById('diff-side-b-title').innerText = `Solo in ${nodeB.label} (Added in B):`;
                let htmlB = `<div><strong>Objects:</strong></div>` + (objOnlyInB.map(generateSquare).join('') || '-');
                htmlB += `<div style="margin-top:8px;"><strong>Relations:</strong></div>` + (relOnlyInB.map(r => formatRelation(r, '#44ff44')).join('') || '-');
                document.getElementById('diff-side-b').innerHTML = htmlB;
                
                diffPanel.style.display = 'block';
            } else {
                pinnedNode = null;
                document.getElementById('hover-panel').style.display = 'none';
                document.getElementById('hover-panel').style.border = 'none';
                diffPanel.style.display = 'none';
            }
        });
    </script>
</body>
</html>
