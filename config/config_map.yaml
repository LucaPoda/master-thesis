    extensions: [1.0, 1.0, 1.0]
    color: [1.0, 0.0, 0.0, 1.0]

  # ==========================================
  # Suspended Zone (Tests over, under)
  # ==========================================
  O1: # Ground Obstacle
    center: [15.0, 0.0, 1.0]
    extensions: [1.0, 1.0, 1.0]
    color: [1.0, 0.5, 0.0, 1.0] 

  A1: # Arch / Beam floating directly over O1 (O1 max_z=2.0, A1 min_z=5.0)
