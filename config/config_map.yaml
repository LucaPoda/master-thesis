  # Stacked Zone (Tests on-top, on-bottom)
  # ==========================================
  P1: # Platform
    center: [-15.0, 0.0, 1.0]
    extensions: [3.0, 3.0, 1.0]
    color: [0.0, 1.0, 0.0, 1.0] 
    
