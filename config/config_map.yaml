    extensions: [0.5, 0.5, 1.0]
    color: [0.8, 0.6, 0.1, 1.0]

  # ==========================================
  # Proximity Cluster (Tests near)
  # ==========================================
  CR1:
    center: [-30.0, 30.0, 1.0]
    extensions: [1.0, 1.0, 1.0]
    color: [0.4, 0.1, 0.6, 1.0]
  CR2:
    center: [-33.0, 31.0, 1.0] # Dist = ~3.16 (Near CR1)
